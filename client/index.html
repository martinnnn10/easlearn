<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EAS | Industrial Maintenance Training Platform</title>
    <meta name="description" content="Built from real plant-floor maintenance experience. AI-powered troubleshooting simulator, structured courses for PLC, VFD, motors, and industrial controls training." />
    <meta name="keywords" content="industrial training, PLC troubleshooting, maintenance technician training, controls technician, electrical troubleshooting, VFD, motor control, safety circuits, PowerFlex" />
    <meta name="author" content="Electrical Automation Services Inc." />
    <meta name="robots" content="index, follow" />
    <!-- Security: CSP meta tag ensures protection even when CDN strips response headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://*.umami.is https://manus-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' https://api.stripe.com https://*.umami.is https://*.manus.space https://manus-analytics.com wss:; frame-src 'self' https://js.stripe.com; object-src 'none'; base-uri 'self'" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="canonical" href="https://easlearn.org" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EAS | Industrial Maintenance Training Platform" />
    <meta property="og:description" content="AI-powered troubleshooting simulator and structured courses for electrical maintenance technicians. Built from real plant-floor experience." />
    <meta property="og:site_name" content="Electrical Automation Services" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EAS | Industrial Maintenance Training Platform" />
    <meta name="twitter:description" content="AI-powered troubleshooting simulator and structured courses for electrical maintenance technicians." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Electrical Automation Services Inc.",
      "description": "Industrial maintenance training platform with AI-powered troubleshooting simulation, structured courses for PLC, VFD, motors, and industrial controls.",
      "url": "https://easlearn.org",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "eas@eautomatedstaffing.com"
      },
      "serviceType": ["Industrial Training", "Troubleshooting Simulation", "Certification"]
    }
    </script>

    <!-- PWA / iOS Standalone Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EASLearn" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663631243604/dBvv3KQQ9K9tWbpcptY97y/eas-pwa-icon-512-SUUjmf4Tnn5CwArSvnWPag.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#059669" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Inter:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
